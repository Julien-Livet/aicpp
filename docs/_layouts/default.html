<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

  <div class="site-wrapper">

    <aside class="sidebar">

      <div class="sidebar-header">
        <a href="{{ '/' | relative_url }}" class="site-title">
          aicpp
        </a>

        <p class="site-description">
          Neuro-symbolic program synthesis
        </p>
      </div>

      <nav class="navigation">

        <div class="nav-section">
          <div class="nav-heading">RESEARCH</div>

          <a href="{{ '/research.html' | relative_url }}">
            Research
          </a>

          <a href="{{ '/architecture.html' | relative_url }}">
            Architecture
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-heading">EXPERIMENTS</div>

          <a href="{{ '/experiments.html' | relative_url }}">
            Experiments
          </a>

          <a href="{{ '/results.html' | relative_url }}">
            Results
          </a>

          <a href="{{ '/embeddings.html' | relative_url }}">
            Program Embeddings
          </a>

          <a href="{{ '/arc-agi-2.html' | relative_url }}">
            ARC-AGI-2
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-heading">RESOURCES</div>

          <a href="{{ '/publications.html' | relative_url }}">
            Publications
          </a>

          <a href="{{ '/perspectives.html' | relative_url }}">
            Perspectives
          </a>
        </div>

      </nav>

      <div class="sidebar-footer">
        <a href="https://github.com/Julien-Livet/aicpp">
          GitHub
        </a>
      </div>

    </aside>


    <main class="content">

      {% if page.title %}
        <header class="page-header">
          <h1>{{ page.title }}</h1>
        </header>
      {% endif %}

      <article>
        {{ content }}
      </article>

    </main>

  </div>

</body>
</html>
